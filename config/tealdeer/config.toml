# source: https://dbrgn.github.io/tealdeer/config.html#config-example
[display]
compact = false
use_pager = true

[directories]
# The docs say no expansion, but tealdeer 1.9.1 expands a leading `~`
# (src/config.rs expand_home; checked with `tldr --show-paths`).
# source: https://dbrgn.github.io/tealdeer/config_directories.html#cache_dir
cache_dir = "~/.cache/tealdeer"

[style.command_name]
foreground = "red"

[style.example_text]
foreground = "green"

[style.example_code]
foreground = "blue"

[style.example_variable]
foreground = "blue"
underline = true

[updates]
auto_update = true
