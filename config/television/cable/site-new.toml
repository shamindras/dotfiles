# site-new — shamindras.com post templates, previewed: Enter runs `site-post new`
# from the chosen template. Neovim twin: <leader>en.

[metadata]
name = "site-new"
description = "shamindras.com: start a post from a template"
requirements = ["just", "bat"]

[source]
command = 'ls "$("${XDG_CONFIG_HOME:-$HOME/.config}/bin/site-post" --repo)/content/templates" | grep -v README | sed "s/\.md$//"'

[preview]
command = 'bat --color=always --style=plain "$("${XDG_CONFIG_HOME:-$HOME/.config}/bin/site-post" --repo)/content/templates/{}.md"'

[keybindings]
enter = "actions:new"

[actions.new]
description = "Start a post from this template"
command = '"${XDG_CONFIG_HOME:-$HOME/.config}/bin/site-post" new --template {}'
mode = "execute"
