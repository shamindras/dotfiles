#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Reject unknown fields (typos) instead of silently ignoring them.
strict_mode = true

# Picker (sesh picker, bound in tmux `N s` / `N #`): live tmux sessions
# first (most recently attached on top — `#` numbers are a recency stack,
# not a fixed index; aliases are the fixed targets), then [[session]]
# entries in file order, then zoxide.
sort_order = ["tmux", "config", "zoxide"]

[tui]
show_icons = true
show_windows = true        # dimmed window names after each session
group_separator = true     # faint rule between the sort_order groups
prompt = "⚡ "
placeholder = "session"
preview = false

# Source glyphs (also shown by `sesh list --icons`). Per-session `icon`
# fields override these in the picker.
[icons]
tmux   = { icon = "", color = "green" }
config = { icon = "", color = "blue" }
zoxide = { icon = "", color = "cyan" }

# First [[session]] is where `sra` (sesh-reset --all) lands and the top
# row of the sesh picker — keep `notes` here.
[[session]]
name = "notes"
path = "~/Dropbox/notes/zk"
startup_command = "~/.config/sesh/scripts/notes.sh"
alias = "nn"
alias_auto_connect = true
icon = "📓"

[[session]]
name = "play"
path = "~/Dropbox/repos/codebox"
startup_command = "~/.config/sesh/scripts/play.sh"
alias = "pp"
alias_auto_connect = true
icon = "🧪"

[[session]]
name = "dots"
path = "~/Dropbox/repos/dotfiles"
startup_command = "~/.config/sesh/scripts/dots.sh"
alias = "dd"
alias_auto_connect = true
icon = "🔧"

[[session]]
name = "career"
path = "~/Dropbox/repos/ss_applications"
startup_command = "~/.config/sesh/scripts/career.sh"
alias = "cc"
alias_auto_connect = true
icon = "💼"

[[session]]
name = "blog"
path = "~/Dropbox/repos/ss_personal_quarto_blog"
startup_command = "~/.config/sesh/scripts/blog.sh"
alias = "bb"
alias_auto_connect = true
icon = "✍️ "

[[session]]
name = "feed"
path = "~/Downloads"
startup_command = "~/.config/sesh/scripts/feed.sh"
alias = "ff"
alias_auto_connect = true
icon = "📰"

# Picker icons for the ad-hoc tier (dirs.list roots). Icon only — the
# layout stays with [default_session] below; a wildcard startup_command
# would silently override default.sh. Each root is listed twice because
# sesh reports both the ~/Dropbox symlink and its CloudStorage target.
[[wildcard]]
pattern = "~/Dropbox/repos/*"
icon = "📦"

[[wildcard]]
pattern = "~/Library/CloudStorage/Dropbox/repos/*"
icon = "📦"

[[wildcard]]
pattern = "~/Dropbox/resources/**"
icon = "📚"

[[wildcard]]
pattern = "~/Library/CloudStorage/Dropbox/resources/**"
icon = "📚"

[[wildcard]]
pattern = "~/Dropbox/entertainment/**"
icon = "🎧"

[[wildcard]]
pattern = "~/Library/CloudStorage/Dropbox/entertainment/**"
icon = "🎧"

# Applies ONLY to sessions with no [[session]] entry above (ad-hoc
# directories from sesh-dir-picker or zoxide connects). Per-session
# startup_command wins; opt a session out with disable_startup_command.
[default_session]
startup_command = "~/.config/sesh/scripts/default.sh"
