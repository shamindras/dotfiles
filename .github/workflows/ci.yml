# CI for the profile-driven bootstrap (node N1 skeleton).
#
# static:  Linux, layer 1 (just test_static, which includes zizmor).
# macos:   one job per profile, layers 1 and 2 (just test).
# bootstrap: layer 3, a real ./bootstrap per profile on a clean runner, then a
#          second links-only run.
# Every PASS, FAIL, XFAIL, XPASS and SKIP line goes to the run summary.
# Actions are pinned to commit SHAs (version in the trailing comment);
# .github/dependabot.yml moves them. No checkout keeps its token.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-invariants reads Node: trailers from history
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Static checks
        run: just test_static
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  macos:
    name: macos (${{ matrix.profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [home, work]
    env:
      DOTFILES_TEST_PROFILES: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: Static and sandbox tests
        run: just test

  bootstrap:
    name: bootstrap (${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [home, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Real bootstrap on a clean runner
        env:
          PROFILE: ${{ matrix.profile }}
        run: ./bootstrap --profile "$PROFILE" --no-hints </dev/null
      - name: Second run changes nothing it should not
        run: ./install --links-only
