# CI for the profile-driven bootstrap (node N1 skeleton).
#
# static:  Linux, layer 1 (just test_static).
# macos:   one job per profile, layers 1 and 2 (just test). Layer 3, a real
#          ./bootstrap on the clean runner, is added by node N5.
# Every PASS, FAIL, XFAIL, XPASS and SKIP line goes to the run summary.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-invariants reads Node: trailers from history
      - uses: extractions/setup-just@v2
      - name: Static checks
        run: just test_static

  macos:
    name: macos (${{ matrix.profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [home, work]
    env:
      DOTFILES_TEST_PROFILES: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: Static and sandbox tests
        run: just test
