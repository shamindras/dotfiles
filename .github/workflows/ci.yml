# CI for the profile-driven bootstrap (node N1 skeleton).
#
# static:  Linux, layer 1 (just test_static).
# macos:   one job per profile, layers 1 and 2 (just test).
# bootstrap: layer 3, a real ./bootstrap per profile on a clean runner, then a
#          second links-only run.
# Every PASS, FAIL, XFAIL, XPASS and SKIP line goes to the run summary.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check-invariants reads Node: trailers from history
      - uses: extractions/setup-just@v4
      - name: Static checks
        run: just test_static
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  macos:
    name: macos (${{ matrix.profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [home, work]
    env:
      DOTFILES_TEST_PROFILES: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: Static and sandbox tests
        run: just test

  bootstrap:
    name: bootstrap (${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [home, work]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Real bootstrap on a clean runner
        run: ./bootstrap --profile ${{ matrix.profile }} --no-hints
      - name: Second run changes nothing it should not
        run: ./install --links-only
